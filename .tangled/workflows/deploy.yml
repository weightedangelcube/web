when:
  - event: ["push"]
    branch: ["main"]

engine: "microvm"
image: "nixos"

environment: 
  MINIFLARE_WORKERD_PATH: 

dependencies:
  - nodejs_26
  - lilypond
  - steam-run-free

steps:
  - name: "install dependencies"
    command: npm ci
  - name: "build"
    command: steam-run npm run build
  - name: "deploy"
    command: "npx wrangler deploy --message \"$(git log -1 --pretty=%B)\""
    environment:
      NODE_ENV: "production"
      # Tangled UI renders ANSI colour codes as raw text
      NO_COLOR: "true"
      DO_NOT_TRACK: 1
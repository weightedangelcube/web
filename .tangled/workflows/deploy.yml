when:
  - event: ["push"]
    branch: ["main"]

engine: "microvm"

dependencies:
  - nodejs_24
  - lilypond

steps:
  - name: "install dependencies"
    command: npm ci
  - name: "build"
    command: npm run build
  - name: "login to Cloudflare"
    command: npx wrangler login
  - name: "deploy"
    command: "npx wrangler deploy --message '$(git log -1 --pretty=%B)'"
    environment:
      NODE_ENV: "production"
      # Tangled UI renders ANSI colour codes as raw text
      NO_COLOR: "true"
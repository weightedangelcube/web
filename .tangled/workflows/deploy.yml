when:
  - event: ["push"]
    branch: ["main"]

engine: "microvm"

dependencies:
  - nodejs_24
  - lilypond
  - netlify-cli

steps:
  - name: "install dependencies"
    command: npm i
  - name: "deploy to Netlify"
    command: |
      commit_msg=$(git show "$TANGLED_SHA" --pretty=%B -s)
      netlify deploy \
        --site $NETLIFY_SITE_ID \
        --message="${commit_msg:-deploy from Tangled CI}"
    environment:
      NODE_ENV: "production"
      # Tangled UI renders ANSI colour codes as raw text
      NO_COLOR: "true"